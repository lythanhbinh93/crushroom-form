<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Counter</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      color: #fff;
      font-family: 'Montserrat', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #000;
    }

    /* Loading / error states */
    .state-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 40px 20px;
    }
    .state-screen .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    .state-screen p { font-size: 14px; color: #aaa; }
    .state-screen .err { color: #ff6b6b; }

    /* Main container */
    #love-counter-container {
      display: none;
      text-align: center;
      padding: 50px 20px;
      position: relative;
      background-size: cover;
      background-position: center;
      min-height: 100vh;
    }
    #love-counter-container.ready { display: block; }

    /* Overlay */
    .bg-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 0;
    }

    /* Content */
    .lc-content {
      position: relative;
      z-index: 1;
      color: #fff;
    }

    .love-title {
      font-size: 20px;
      margin-bottom: 20px;
      color: #fff;
    }

    /* SVG heart */
    .svg-heart-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 30px auto;
    }
    .svg-heart {
      width: 100%;
      height: 100%;
      transform-origin: center;
      animation: pulse 2s infinite ease-in-out;
    }
    .heart-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #fff;
      z-index: 1;
      animation: heart-content-pulse 2s infinite ease-in-out;
    }
    .heart-text {
      font-size: 1rem;
      margin: 0;
      color: #fff;
      animation: heart-text-animation 5s infinite;
    }
    .days-count {
      font-size: 3rem;
      margin: 0;
      font-weight: bold;
      color: #fff;
    }
    .days-label {
      font-size: 1rem;
      margin: 0;
      color: #fff;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    @keyframes heart-content-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.1); }
    }
    @keyframes heart-text-animation {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Couple info */
    .couple-section {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
    .couple-person {
      text-align: center;
    }
    .couple-person img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid #fff;
      margin-bottom: 10px;
      object-fit: cover;
    }
    .couple-person p {
      margin: 0;
      color: #fff;
      font-size: 14px;
    }
    .couple-heart {
      font-size: 2rem;
      color: #fff;
    }

    /* Audio player */
    .audio-player {
      display: none;
      margin-top: 30px;
      background-color: rgba(0, 0, 0, 0.5);
      color: #fff;
      padding: 15px;
      border-radius: 10px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
    .audio-player.has-audio { display: block; }

    .audio-player .player-title {
      margin-bottom: 8px;
      font-size: 14px;
    }
    .player-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .player-row button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 40px;
      color: #fff;
    }
    #lc-waveform {
      flex-grow: 1;
      height: 80px;
      background-color: transparent;
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div class="state-screen" id="loading-screen">
    <div>
      <div class="spinner"></div>
      <p>Đang tải...</p>
    </div>
  </div>

  <!-- Error -->
  <div class="state-screen" id="error-screen" style="display:none;">
    <div>
      <p class="err" id="error-msg">Không tìm thấy nội dung.</p>
    </div>
  </div>

  <!-- Love Counter page -->
  <div id="love-counter-container">
    <div class="bg-overlay"></div>
    <div class="lc-content">
      <h2 class="love-title" id="lc-title"></h2>

      <!-- Animated Heart -->
      <div class="svg-heart-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#ff5c5c" class="svg-heart">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <div class="heart-content">
          <p class="heart-text" id="lc-heart-text"></p>
          <p class="days-count" id="lc-days">0</p>
          <p class="days-label">days</p>
        </div>
      </div>

      <!-- Couple Info -->
      <div class="couple-section">
        <div class="couple-person">
          <img src="" alt="Male Avatar" id="lc-male-avatar">
          <p id="lc-male-name"></p>
        </div>
        <div class="couple-heart">&#10084;&#65039;</div>
        <div class="couple-person">
          <img src="" alt="Female Avatar" id="lc-female-avatar">
          <p id="lc-female-name"></p>
        </div>
      </div>

      <!-- Audio Player (shown only if voice exists) -->
      <div class="audio-player" id="lc-audio-player">
        <p class="player-title"><strong><span id="lc-audio-title"></span></strong></p>
        <div class="player-row">
          <button id="lc-playPause" aria-label="Play/Pause">
            <i class="fa-solid fa-circle-play" id="lc-playIcon"></i>
          </button>
          <div id="lc-waveform"></div>
        </div>
        <div class="time-row">
          <div id="lc-currentTime">0:00</div>
          <div id="lc-totalTime">0:00</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/wavesurfer.js@6.0.0"></script>
  <script>
    (function () {
      var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbweeqxM3blNgfqB4A1y2HBaGfQcfUcpTdksG0GBiW29NLyUOr1C0Hl95Naju3AjgRq4qg/exec';

      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');

      var loadingScreen = document.getElementById('loading-screen');
      var errorScreen = document.getElementById('error-screen');
      var errorMsg = document.getElementById('error-msg');
      var container = document.getElementById('love-counter-container');

      if (!id) {
        showError('Link không hợp lệ — thiếu ID.');
        return;
      }

      fetch(SCRIPT_URL + '?action=get&type=love_counter&id=' + encodeURIComponent(id))
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (data) {
          if (!data.success || !data.result) {
            throw new Error(data.error || 'Không tìm thấy bản ghi.');
          }
          renderPage(data.result);
        })
        .catch(function (err) {
          showError(err.message);
        });

      function showError(msg) {
        loadingScreen.style.display = 'none';
        errorMsg.textContent = msg;
        errorScreen.style.display = 'flex';
      }

      function renderPage(d) {
        loadingScreen.style.display = 'none';

        // Background
        if (d.background_url) {
          container.style.backgroundImage = "url('" + d.background_url + "')";
        }

        // Title
        document.getElementById('lc-title').textContent = d.love_title || '\u2764\uFE0F Been Love Memory \u2764\uFE0F';

        // Heart text
        document.getElementById('lc-heart-text').textContent = d.heart_text || '';

        // Days counter
        if (d.love_day) {
          var loveDate = new Date(d.love_day);
          var now = new Date();
          var diffMs = now.getTime() - loveDate.getTime();
          var days = Math.ceil(diffMs / 86400000);
          document.getElementById('lc-days').textContent = days > 0 ? days : 0;
        }

        // Couple
        var maleAvatar = document.getElementById('lc-male-avatar');
        maleAvatar.src = d.male_avatar_url || '';
        maleAvatar.onerror = function () { this.style.display = 'none'; };

        document.getElementById('lc-male-name').textContent = d.male_name || '';

        var femaleAvatar = document.getElementById('lc-female-avatar');
        femaleAvatar.src = d.female_avatar_url || '';
        femaleAvatar.onerror = function () { this.style.display = 'none'; };

        document.getElementById('lc-female-name').textContent = d.female_name || '';

        // Show container
        container.classList.add('ready');

        // Audio player (optional)
        if (d.voice_url) {
          initAudioPlayer(d);
        }
      }

      function initAudioPlayer(d) {
        var playerEl = document.getElementById('lc-audio-player');
        playerEl.classList.add('has-audio');

        document.getElementById('lc-audio-title').textContent = d.audio_title || '';

        if (typeof WaveSurfer === 'undefined') {
          console.error('WaveSurfer not loaded');
          return;
        }

        var preloadLink = document.createElement('link');
        preloadLink.rel = 'preload';
        preloadLink.as = 'audio';
        preloadLink.href = d.voice_url;
        document.head.appendChild(preloadLink);

        var wavesurfer = WaveSurfer.create({
          container: '#lc-waveform',
          waveColor: '#878787',
          progressColor: '#fff',
          barWidth: 2,
          height: 80
        });

        wavesurfer.load(d.voice_url);

        var playBtn = document.getElementById('lc-playPause');
        var playIcon = document.getElementById('lc-playIcon');

        playBtn.addEventListener('click', function () {
          wavesurfer.playPause();
          playIcon.classList.toggle('fa-circle-play', !wavesurfer.isPlaying());
          playIcon.classList.toggle('fa-circle-pause', wavesurfer.isPlaying());
        });

        wavesurfer.on('finish', function () {
          playIcon.classList.remove('fa-circle-pause');
          playIcon.classList.add('fa-circle-play');
        });

        wavesurfer.on('audioprocess', function () {
          document.getElementById('lc-currentTime').textContent = formatTime(wavesurfer.getCurrentTime());
          document.getElementById('lc-totalTime').textContent = formatTime(wavesurfer.getDuration());
        });

        wavesurfer.on('ready', function () {
          document.getElementById('lc-totalTime').textContent = formatTime(wavesurfer.getDuration());
        });
      }

      function formatTime(seconds) {
        var m = Math.floor(seconds / 60);
        var s = Math.floor(seconds % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
      }
    })();
  </script>
</body>
</html>
