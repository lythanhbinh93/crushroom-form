[package]
name = "bundle-discount"
version = "1.0.0"
edition = "2021"
authors = ["Dopamiles"]
description = "POD bundle quantity-tier discount Function"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "bundle_discount"
path = "src/main.rs"

[dependencies]
shopify_function = "0.8"
graphql_client = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
